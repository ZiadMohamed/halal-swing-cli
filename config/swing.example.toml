# Live v0 checklist defaults. Not financial advice. Not a Shariah certification.
#
# Copy to ~/.swing/config.toml. This example is not loaded unless you point the CLI at it.
# A repo-root swing.toml is also read and is gitignored.
# Recorded operator choices: docs/decisions/SECTION8_ANSWERS.md
#
# The values below are the built-ins. Leave them as they are in this file.
# Set these only in your copy of ~/.swing/config.toml:
#   account.equity_usd — satellite sleeve in USD, starting near 20% of total USD equity.
#     Not total net worth. Unset here, so the example matches the built-in.
#   risk.per_trade — 0.005 until book.jsonl has 20 closed real fills, then 0.01.
#     The built-in below stays 0.01. Plans are not fills.
# benchmark.symbol is "SPUS", or the screened core ETF you actually hold.
# The live loader rejects that key. swing review still compares with SPUS.
# Keep the core ETF out of universe.txt.
#
# Time-stops are intentionally absent. They were not locked.

schema_version = "1"
max_concurrent_positions = 4

[account]
mode = "cash"
longs_only = true
# Satellite sleeve in USD, starting near 20% of total USD equity. Not total net worth.
# Unset refuses the trade instead of guessing. v0 does not convert other currencies.
# A single run can pass --equity USD instead. That override does not change config_hash.
# The CLI prints the plan. Type the cash long in Interactive Brokers. It does not send orders.
# equity_usd =

[risk]
# Built-in stays 0.01, including backtests.
# In ~/.swing/config.toml use 0.005 until 20 closed real fills, then 0.01.
per_trade = 0.01

[heat]
total_max = 0.06
sector_max = 0.03

[setups]
mutex_order = ["BO_RVOL", "PB_EMA", "RSI2_MR"]

[setups.bo_rvol]
rvol_min = 1.5
breakout_lookback = 20
sma_period = 50

[setups.pb_ema]
ema_trend = 50
ema_touch = 20

[setups.rsi2_mr]
rsi_period = 2
rsi_max = 10
sma_trend = 200

[stops]
atr_period = 14
atr_multiple = 1.5
reward_r = 2.0

[earnings]
strict = true
blackout_before_days = 2
blackout_after_days = 1

[exdiv]
strict = false
block_yield_gte = 0.01

[data]
bars_provider = "yfinance"
events_provider = "finnhub"

[journal]
mode = "paper_jsonl"

[shariah]
screen_in_v0 = false

[timezone]
user = "Africa/Cairo"
market = "America/New_York"

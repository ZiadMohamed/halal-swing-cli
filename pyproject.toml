[project]
name = "halal-swing-cli"
version = "0.1.0"
description = "Personal local cash-long swing checklist CLI. Not financial advice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Personal" }
authors = [{ name = "Ziad Osman" }]
dependencies = [
    "exchange-calendars>=4.13.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.6,<3",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swing = "swing.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
